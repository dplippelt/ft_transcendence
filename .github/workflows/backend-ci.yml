name: Backend CI

on:
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docker-compose.test.yml"
      - "scripts/test.sh"
      - "Makefile"
  push:
    branches:
      - master
    paths:
      - "services/backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docker-compose.test.yml"
      - "scripts/test.sh"
      - "Makefile"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ruff
        run: |
          docker compose -p ft_transcendence-test \
            -f docker-compose.test.yml \
            run --rm --no-deps --build backend-test \
            python -m ruff check app tests

      - name: Pytest
        run: make test

      - name: Cleanup
        if: always()
        run: |
          docker compose -p ft_transcendence-test \
            -f docker-compose.test.yml \
            down --remove-orphans
